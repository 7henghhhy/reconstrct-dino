name: Geometry checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libgomp1
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile feature.py match.py initialize.py reconstruct.py ba.py main.py
      - run: python -m unittest discover -s tests -v
